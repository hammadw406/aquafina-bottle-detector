<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aquafina Bottle Detector</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
</head>
<body>
  <header>
    <h1>🍼 Aquafina Bottle Detector</h1>
    <p>YOLOv8 model running <strong>entirely in your browser</strong> via ONNX Runtime Web — no server, no upload.</p>
  </header>

  <main>
    <div class="controls">
      <label class="upload-btn">
        Upload Image
        <input type="file" id="imageInput" accept="image/*" hidden>
      </label>
      <button id="webcamBtn">Use Webcam</button>
      <label>
        Confidence: <span id="confVal">0.40</span>
        <input type="range" id="confSlider" min="0.05" max="0.95" step="0.05" value="0.4">
      </label>
      <span id="status">Loading model…</span>
    </div>

    <div class="canvas-wrap">
      <canvas id="canvas"></canvas>
      <video id="video" autoplay playsinline hidden></video>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
